# fly.toml app configuration file generated for gatch-it-all on 2026-05-16T13:44:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gatch-it-all'
primary_region = 'ams'

[build]
  build_command = "npm run build"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
